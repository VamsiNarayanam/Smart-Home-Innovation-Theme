<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly — Page not found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
</head>
<body class="missing">
  <div class="preloader" id="preloader" aria-busy="true" aria-live="polite">
    <div class="preloader__atmosphere" aria-hidden="true">
      <span class="preloader__orb preloader__orb--a"></span>
      <span class="preloader__orb preloader__orb--b"></span>
      <span class="preloader__grid"></span>
    </div>
    <div class="preloader__inner">
      <div class="preloader__mark">
        <span class="preloader__ring preloader__ring--outer"></span>
        <span class="preloader__ring preloader__ring--mid"></span>
        <span class="preloader__ring preloader__ring--inner"></span>
        <span class="preloader__pulse"></span>
        <img class="preloader__logo" src="Images/Stackly-logo.webp" alt="Stackly">
      </div>
      <p class="preloader__brand">STACKLY</p>
      <p class="preloader__label">Preparing your space</p>
      <div class="preloader__dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>

  <main class="missing__main">
    <p class="missing__code">404</p>
    <h1>This page isn’t here</h1>
    <p>That address doesn’t match a room in the house. Go back to where you were, or return to the front door.</p>
    <div class="missing__actions">
      <button class="btn btn--dark" type="button" id="go-back">Go back</button>
      <a class="btn btn--line" href="index.html">Return home</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="js/preloader.js"></script>
  <script src="js/motion.js"></script>
  <script>
    document.getElementById("go-back").addEventListener("click", () => {
      let sameSite = false;
      if (document.referrer) {
        try {
          sameSite = new URL(document.referrer).origin === location.origin;
        } catch (error) {
          sameSite = false;
        }
      }
      if (sameSite) history.back();
      else location.href = "index.html";
    });
  </script>
</body>
</html>
