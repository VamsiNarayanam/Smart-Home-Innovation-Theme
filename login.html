<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackly — Sign In</title>
  <meta name="description" content="Sign in to your Stackly account for product installations, support plans, and customization requests.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth">
  <main class="auth-shell">
    <aside class="auth-visual" aria-hidden="true">
      <img src="Images/auth-signin-panel.webp" alt="" width="960" height="1280">
    </aside>

    <section class="auth-panel">
      <a class="auth-logo" href="index.html" aria-label="Stackly home">
        <img src="Images/Stackly-logo.webp" alt="Stackly">
      </a>

      <h1>Sign In to Your Account</h1>
      <p class="auth-lead">Log in to continue with your product installations, support plans, or customization requests.</p>

      <form class="auth-form" id="login-form" novalidate>
        <label class="auth-field">
          <span>Name <em>*</em></span>
          <span class="auth-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 19c.8-3 3.2-4.5 6.5-4.5s5.7 1.5 6.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="login-name" name="name" type="text" autocomplete="name" placeholder="Enter your name" required>
          </span>
        </label>

        <label class="auth-field">
          <span>Email <em>*</em></span>
          <span class="auth-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M14.8 12a8 8 0 1 1-1.2-4.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="Example@gmail.com" required>
          </span>
        </label>

        <label class="auth-field">
          <span>Password <em>*</em></span>
          <span class="auth-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8.2 10.5V8.4a3.8 3.8 0 0 1 7.6 0v2.1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="8" required>
            <button class="auth-eye" type="button" aria-label="Show password" data-target="login-password">
              <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.6-6.5 9-6.5S21 12 21 12s-3.6 6.5-9 6.5S3 12 3 12Z" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="12" cy="12" r="2.4" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m4.5 4.5 15 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
          </span>
          <small>At least 8 characters.</small>
        </label>

        <label class="auth-field">
          <span>Dashboard role <em>*</em></span>
          <span class="auth-input auth-input--select">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 19c.8-3 3.2-4.5 6.5-4.5s5.7 1.5 6.5 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <select id="login-role" name="role" required>
              <option value="client">Client dashboard</option>
              <option value="admin">Admin dashboard</option>
            </select>
          </span>
        </label>

        <div class="auth-row">
          <label class="auth-check">
            <input id="login-remember" name="remember" type="checkbox">
            <span>Remember me</span>
          </label>
          <a class="auth-forgot" href="404.html">Forgot Password?</a>
        </div>

        <p class="auth-error" id="login-error" role="alert"></p>

        <button class="auth-submit" type="submit">Sign in</button>
      </form>

      <p class="auth-switch">Don’t have an account? <a href="register.html">Create Account?</a></p>

      <div class="auth-or"><span>OR</span></div>

      <div class="auth-social">
        <button type="button" class="auth-social__btn" onclick="window.location.href='404.html'" >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h5.9c-.3 1.3-1 2.5-2.1 3.2v2.7h3.4c2-1.8 3.3-4.5 3.3-8Z"/><path fill="#34A853" d="M12 23c2.8 0 5.2-.9 6.9-2.5l-3.4-2.7c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H2.7v2.8C4.4 20.7 8 23 12 23Z"/><path fill="#FBBC05" d="M6.2 14.5c-.2-.6-.3-1.2-.3-1.9s.1-1.3.3-1.9V7.9H2.7C2.1 9.1 1.8 10.5 1.8 12s.3 2.9.9 4.1l3.5-2.6Z"/><path fill="#EA4335" d="M12 5.8c1.5 0 2.9.5 4 1.6l3-3C17.2 2.6 14.8 1.6 12 1.6 8 1.6 4.4 3.9 2.7 7.9l3.5 2.8C7 7.6 9.3 5.8 12 5.8Z"/></svg>
          Sign In with Google
        </button>
        <button type="button" class="auth-social__btn" onclick="window.location.href='404.html'">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.7 12.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.7-2.7-.7-1.4 0-2.7.8-3.4 2.1-1.5 2.5-.4 6.3 1 8.3.7 1 1.5 2.1 2.6 2 .9 0 1.3-.6 2.6-.6 1.2 0 1.6.6 2.6.6 1.1 0 1.8-1 2.4-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.3Zm-2-6.3c.6-.7 1-1.7.9-2.7-1 .1-2.1.7-2.7 1.4-.6.6-1.1 1.6-.9 2.6 1.1.1 2.1-.5 2.7-1.3Z"/></svg>
          Sign In with Apple
        </button>
      </div>

      <p class="auth-legal">By creating account you agree to Company <a href="404.html">Terms of Service</a> and <a href="404.html">Privacy Policy</a>.</p>

      <a class="auth-back" href="index.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6 9 12l6 6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to home
      </a>
    </section>
  </main>

  <script src="js/auth.js"></script>
</body>
</html>
